# Nombre de la aplicación registrada en Eureka Server
spring.application.name=auth-service

# Puerto donde se ejecuta el microservicio
server.port=8081

# Configuración de la base de datos PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/db_auth
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Registro en Eureka Server
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Clave secreta compartida para la firma de JWT
jwt.secret=ClaveSecretaSuperSeguraParaCibertec2026Cibertec
