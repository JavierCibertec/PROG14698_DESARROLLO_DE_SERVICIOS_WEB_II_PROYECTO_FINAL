<div class="container mt-4">
  <h2>Gestión de Médicos</h2>

  <!-- Formulario de Registro rápido -->
  <div class="card p-3 mb-4 shadow-sm">
    <h4>Registrar Nuevo Médico</h4>
    <div class="row g-3">
      <div class="col-md-3"><input type="text" [(ngModel)]="newDoctor.firstName" placeholder="Nombres" class="form-control"></div>
      <div class="col-md-3"><input type="text" [(ngModel)]="newDoctor.lastName" placeholder="Apellidos" class="form-control"></div>
      <div class="col-md-3"><input type="text" [(ngModel)]="newDoctor.cmp" placeholder="CMP" class="form-control"></div>
      <div class="col-md-3"><input type="text" [(ngModel)]="newDoctor.specialty" placeholder="Especialidad" class="form-control"></div>
      <div class="col-md-4"><input type="email" [(ngModel)]="newDoctor.email" placeholder="Correo" class="form-control"></div>
      <div class="col-md-4"><input type="text" [(ngModel)]="newDoctor.phone" placeholder="Teléfono" class="form-control"></div>
      <div class="col-md-4">
        <button class="btn btn-primary w-100" (click)="registerDoctor()">Guardar Médico</button>
      </div>
    </div>
  </div>

  <!-- Tabla de Listado -->
  <h4>Lista de Médicos Registrados</h4>
  <table class="table table-striped table-bordered">
    <thead class="table-dark">
    <tr>
      <th>ID</th>
      <th>Nombres y Apellidos</th>
      <th>CMP</th>
      <th>Especialidad</th>
      <th>Correo</th>
    </tr>
    </thead>
    <tbody>
    <tr *ngFor="let doc of doctors">
      <td>{{ doc.id }}</td>
      <td>Dr. {{ doc.firstName }} {{ doc.lastName }}</td>
      <td>{{ doc.cmp }}</td>
      <td>{{ doc.specialty }}</td>
      <td>{{ doc.email }}</td>
    </tr>
    </tbody>
  </table>
</div>
