<div style="padding: 20px; max-width: 900px; margin: auto; font-family: Arial, sans-serif;">
  <h2>Sistema Inteligente de Gestión de Citas Médicas</h2>

  <div style="background: #f1f5f9; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
    <h3>Programar Nueva Cita</h3>
    <form (ngSubmit)="onSaveAppointment()" style="display: flex; gap: 10px; flex-wrap: wrap;">
      <select [(ngModel)]="newAppointment.patientId" name="patientId" required style="padding: 8px; flex: 1;">
        <option [ngValue]="null" disabled>Seleccionar Paciente</option>
        <option *ngFor="let p of patients" [value]="p.id">{{ p.firstname }} {{ p.lastname }} (DNI: {{ p.dni }})</option>
      </select>

      <select [(ngModel)]="newAppointment.doctorId" name="doctorId" required style="padding: 8px; flex: 1;">
        <option [ngValue]="null" disabled>Seleccionar Médico</option>
        <option *ngFor="let d of doctors" [value]="d.id">Dr. {{ d.firstname }} {{ d.lastname }} - {{ d.specialty }}</option>
      </select>

      <input type="datetime-local" [(ngModel)]="newAppointment.appointmentDate" name="appointmentDate" required style="padding: 8px;" />

      <button type="submit" style="background: #10b981; color: white; border: none; padding: 10px 18px; cursor: pointer; border-radius: 5px; font-weight: bold;">Reservar Cita</button>
    </form>
  </div>

  <h3>Historial de Citas Registradas</h3>
  <table border="1" cellpadding="10" style="width: 100%; border-collapse: collapse; text-align: left;">
    <thead>
    <tr style="background: #e2e8f0;">
      <th>ID Cita</th>
      <th>ID Paciente</th>
      <th>ID Médico</th>
      <th>Fecha y Hora</th>
      <th>Estado</th>
    </tr>
    </thead>
    <tbody>
    <tr *ngFor="let app of appointments">
      <td>{{ app.id }}</td>
      <td>{{ app.patientId }}</td>
      <td>{{ app.doctorId }}</td>
      <td>{{ app.appointmentDate | date:'medium' }}</td>
      <td><span style="background: #d1fae5; color: #065f46; padding: 4px 8px; border-radius: 4px; font-weight: bold;">{{ app.estado || 'RESERVADA' }}</span></td>
    </tr>
    </tbody>
  </table>
</div>
